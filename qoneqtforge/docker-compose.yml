version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:7860"
    env_file: .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/assets:/app/assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
